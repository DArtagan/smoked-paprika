# Worktrunk config: what a new worktree needs before a session can work in it.

[post-start]

# direnv keys its allow list by absolute path, so a fresh worktree is blocked
# even though its .envrc is identical to one already allowed.
trust-envrc = "direnv allow"

# Worktrees otherwise share .git/hooks, and devenv reinstalls the hook shim with
# the activating checkout's config baked in, so moving between checkouts leaves
# one running another's hooks. A per-worktree hooks directory gives each its own.
# Installed immediately: a hooksPath with no hooks in it runs nothing at all,
# and commits would skip every check. Both types, or convco never runs and
# release-please meets messages it cannot read.
own-hooks = """
set -e
git config extensions.worktreeConfig true
git config --worktree core.hooksPath "$(git rev-parse --absolute-git-dir)/hooks"
command -v prek >/dev/null 2>&1 && prek install -t pre-commit -t commit-msg || true
"""

# The gitignored files a session relies on: CLAUDE.local.md, and the real
# exports under captures/. Linked rather than copied, so there is one copy to
# keep current, and no second copy of anyone's recipes.
local-files = """
primary=$(git worktree list --porcelain | awk '/^worktree /{print substr($0, 10); exit}')
[ -e "$primary/CLAUDE.local.md" ] && ln -sfn "$primary/CLAUDE.local.md" CLAUDE.local.md
[ -d "$primary/captures/exports" ] && mkdir -p captures && ln -sfn "$primary/captures/exports" captures/exports
true
"""
