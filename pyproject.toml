[project]
name = "smoked-paprika"
# Written by release-please; see docs/releasing.md.
version = "0.1.0"
description = "A remote MCP server giving Claude read access to a Paprika recipe export"
license = "MIT"
requires-python = ">=3.15"
dependencies = ["fastmcp>=4.1.4", "uvicorn>=0.32"]

[project.scripts]
smoked-paprika = "smoked_paprika.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]
