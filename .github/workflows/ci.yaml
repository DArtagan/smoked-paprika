name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # The same hooks `git commit` runs, through the same devenv, so CI and a
  # local commit cannot disagree about formatting, lint or tests.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - run: nix profile install nixpkgs#devenv
      - run: devenv test

  # Builds without pushing, so a broken Dockerfile fails here and not in the
  # release that would have published it.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate the example compose.yaml
        run: docker compose config --quiet
